services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    profiles: ["etl"]
    build:
      context: ./etl
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      ETL_DATA_DIR: /data
    volumes:
      - etl_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  etl_data:
